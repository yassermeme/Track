<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111417">
  <title>Iron Log — Offline Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><div><p class="eyebrow">OFFLINE TRAINING LOG</p><h1 id="pageTitle">Today</h1></div><button class="icon-button" id="themeButton" aria-label="Toggle color theme">◐</button></header>
    <section id="exportReminder" class="backup-reminder" hidden><strong>Unsaved backup</strong><span>Your session has changes. Export before closing.</span><button data-action="go-settings">Export</button></section>
    <section id="view" aria-live="polite"></section>
  </main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-tab="today" class="active">⌂<span>Today</span></button><button data-tab="programs">▤<span>Programs</span></button><button data-tab="workout">●<span>Workout</span></button><button data-tab="progress">◒<span>Progress</span></button><button data-tab="library">⌕<span>Library</span></button><button data-tab="settings">⚙<span>Backup</span></button>
  </nav>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <dialog id="dialog"><form method="dialog" id="dialogForm"><button class="dialog-close" value="cancel" aria-label="Close">×</button><div id="dialogContent"></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
